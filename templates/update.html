<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Post</title>
</head>
<body>
<h1>Update Blog Post</h1>

<form method="POST">
    <label for="author">Author:</label>
    <input
            type="text"
            id="author"
            name="author"
            value="{{ post.author }}"
            required
    >

    <label for="title">Title:</label>
    <input
            type="text"
            id="title"
            name="title"
            value="{{ post.title }}"
            required
    >

    <label for="content">Content:</label>
    <textarea
            id="content"
            name="content"
            required
    >{{ post.content }}</textarea>

    <button type="submit">Update Post</button>
</form>
</body>
</html>
